generic-app:
  nameOverride: "teupadel-api"

  namespace:
    create: true
    name: "teupadel"

  image:
    repository: "344965637185.dkr.ecr.us-east-1.amazonaws.com/teupadel/api"
    tag: "latest"

  service:
    port: 80
    targetPort: 8080 # porta real que o container escuta

  httpRoute:
    enabled: true
    gateway:
      name: nginx-gateway
      namespace: nginx-gateway
    hostnames:
      - "api.teupadel.com"

    imagePullSecrets:
    - name: ecr-pull-secret

externalSecrets:
 enabled: true
 secretStoreRef:
   name: aws-ssm
   kind: ClusterSecretStore
 secretName: "teupadel-api-secret"
 data:
   - secretKey: some-key
     remoteRef:
       key: /homelab/teupadel/anthropic_api_key
